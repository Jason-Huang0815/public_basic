[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "public_basic"
version = "0.1.0"
description = "After some learning of engineering, I'm gonna learn it again, more professionally"
readme = "README.md"
requires-python = ">=3.14.5"

dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "BLE","T20"]

[tool.pyright]
include = ["src"]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.14.5"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"